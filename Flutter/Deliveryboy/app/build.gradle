plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services' // ✅ Firebase plugin added
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
// Override per build: ./gradlew assembleRelease -PapiBaseUrl=https://api.example.com/api/
def apiBaseUrl = project.findProperty('apiBaseUrl') ?: 'http://192.168.1.9:5001/api/'

// Release builds must be signed with the real upload key (key.properties). Test APKs may use
// the debug key only when asked: CLIKGETT_ALLOW_DEBUG_SIGNING=true or -PallowDebugSigning.
def allowDebugSigning = System.getenv('CLIKGETT_ALLOW_DEBUG_SIGNING') == 'true' || project.hasProperty('allowDebugSigning')
// HTTP (no TLS) only in debug builds, or release builds made with CLIKGETT_ALLOW_CLEARTEXT=true.
def allowCleartextRelease = System.getenv('CLIKGETT_ALLOW_CLEARTEXT') == 'true'
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.any { t -> (t.name.startsWith('assemble') || t.name.startsWith('bundle') || t.name.startsWith('package')) && t.name.contains('Release') }
    if (releaseTask && !keystorePropertiesFile.exists() && !allowDebugSigning) {
        throw new GradleException('Release build without key.properties. Add the upload keystore (see key.properties.example), ' +
            'or set CLIKGETT_ALLOW_DEBUG_SIGNING=true for a test APK that cannot go to the Play Store.')
    }
    if (releaseTask && apiBaseUrl.startsWith('http://') && !allowCleartextRelease) {
        throw new GradleException("Release build points at plain HTTP (${apiBaseUrl}). Pass -PapiBaseUrl=https://<host>/api/, " +
            'or set CLIKGETT_ALLOW_CLEARTEXT=true for a LAN test build.')
    }
}

android {
    namespace 'com.deliveryboy_clickget'
    compileSdk 36

    defaultConfig {
        applicationId "com.deliveryboy_clickget"
        minSdk 21
        targetSdk 36
        versionCode 7
        versionName "1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders += [networkSecurityConfig: "@xml/network_security_config_dev", usesCleartextTraffic: "true"]
        }
        release {
            manifestPlaceholders += [networkSecurityConfig: allowCleartextRelease ? "@xml/network_security_config_dev" : "@xml/network_security_config",
                                     usesCleartextTraffic: allowCleartextRelease ? "true" : "false"]
            // Uses key.properties (git-ignored, see key.properties.example) when present,
            // otherwise the debug key; debug-signed builds cannot go to the Play Store.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'META-INF/androidx.localbroadcastmanager_localbroadcastmanager.version'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // AndroidX core dependencies
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // UI Components
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // Location services
    implementation 'com.google.android.gms:play-services-location:18.0.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.picasso:picasso:2.71828'

    // Draws the doorstep UPI QR (plain code, without Razorpay's card)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'


    // Firebase
    implementation 'com.google.firebase:firebase-core:17.5.0'
    implementation 'com.google.firebase:firebase-messaging:23.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
