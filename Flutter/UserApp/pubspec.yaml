name: fav_app
description: A new Flutter project.

publish_to: "none"

version: 1.2.4+124

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🍏 Core & State Management
  cupertino_icons: ^1.0.2
  provider: ^6.0.2
  get: ^4.6.5

  # 🎨 UI & Design
  google_fonts: ^4.0.3
  auto_size_text: ^3.0.0
  flutter_svg: ^2.0.4
  cached_network_image: ^3.2.1
  carousel_slider: ^5.0.0
  badges: ^3.0.3
  smooth_page_indicator: ^1.2.1
  flutter_rating_bar: ^4.0.1
  responsive_sizer: ^3.3.0+1
  modal_bottom_sheet: ^3.0.0-pre
  coupon_uikit: ^0.2.1
  animated_text_kit: ^4.2.3
  lottie: ^3.0.0

  # 📱 Input & Forms
  pinput: ^2.2.31
  pin_input_text_field: ^4.1.1

  # 🌐 Networking
  http: ^0.13.3
  http_interceptor: ^1.0.1

  # 📦 Storage & Preferences
  shared_preferences: ^2.0.9

  # 🔌 Connectivity
  connectivity_plus: ^5.0.2
  connectivity_for_web: any

  # 📍 Geolocation & Maps
  geolocator: ^9.0.2
  geolocator_android: 4.6.1
  geocoding: ^2.0.4
  geolocator_web: any
  google_maps_flutter: ^2.1.5
  google_places_flutter: any

  # 🖼️ Media & Pickers
  image_picker: ^0.8.5
  image_picker_for_web: any

  # 🔔 Notifications
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.2.1+2

  # 🔥 Firebase Core
  firebase_core: ^2.24.2

  # 🔐 Permissions
  # permission_handler: ^10.2.0

  # 🌐 Web & External
  url_launcher: ^6.1.2
  url_launcher_web: any
  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.13.0

  # 💸 Payments
  razorpay_flutter: ^1.3.0

  # 🧭 Utilities
  intl: ^0.18.0
  fluttertoast: ^8.0.7
  share_plus: ^7.2.2
  slide_countdown: ^2.0.2
  flutter_launcher_icons: ^0.14.4
  dio: ^5.8.0+1
  path_provider: ^2.1.5
  # open_filex: ^4.7.0
  flutter_inappwebview: ^6.1.0
  shimmer: ^3.0.0
  slide_to_act: ^2.0.2
  flutter_html: 3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  change_app_package_name: ^1.1.0

dependency_overrides:
  google_fonts:
    path: packages/google_fonts
  http: ^1.0.0
  google_maps_flutter_android: 2.14.13

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "Assets/Logo/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - Assets/Images/
    - Assets/Images/categories/
    - Assets/Images/Intro/
    - Assets/Logo/
    - Assets/Images/Auth/
    - Assets/Images/Homepage/
    - Assets/Images/Homepage/Categories/
    - Assets/Images/coupon/
    - Assets/Images/Homepage/combo/
    - Assets/Images/Homepage/orders/
    - Assets/Images/Homepage/cart/
    - Assets/Images/address/
    - Assets/Images/profile/
    - Assets/Images/support/
    - Assets/Images/wallet/
