plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Release builds must be signed with the real upload key (key.properties). Test APKs may use
// the debug key only when asked: CLIKGETT_ALLOW_DEBUG_SIGNING=true or -PallowDebugSigning.
def allowDebugSigning = System.getenv('CLIKGETT_ALLOW_DEBUG_SIGNING') == 'true' || project.hasProperty('allowDebugSigning')
// HTTP (no TLS) only in debug builds, or release builds made with CLIKGETT_ALLOW_CLEARTEXT=true.
def allowCleartextRelease = System.getenv('CLIKGETT_ALLOW_CLEARTEXT') == 'true'
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.any { t -> (t.name.startsWith('assemble') || t.name.startsWith('bundle') || t.name.startsWith('package')) && t.name.contains('Release') }
    if (releaseTask && !keystorePropertiesFile.exists() && !allowDebugSigning) {
        throw new GradleException('Release build without key.properties. Add the upload keystore (see key.properties.example), ' +
            'or set CLIKGETT_ALLOW_DEBUG_SIGNING=true for a test APK that cannot go to the Play Store.')
    }
}

android {
    namespace "com.app.clikget"
    compileSdkVersion 36

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Google Maps key: MAPS_API_KEY in local.properties (kept out of git).
        manifestPlaceholders += [mapsApiKey: localProperties.getProperty('MAPS_API_KEY', '')]
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.app.clikget"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    //  signingConfigs {
    //      release {
    //          keyAlias keystoreProperties['keyAlias']
    //          keyPassword keystoreProperties['keyPassword']
    //          storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
    //          storePassword keystoreProperties['storePassword']
    //      }
    //  }
    // buildTypes {
    //     release {
    //         signingConfig signingConfigs.release
    //         minifyEnabled true
    //         shrinkResources false
    //         // useProguard true
    //         // shrinkResources false
    //         proguardFiles getDefaultProguardFile('proguard-android.txt'),
    //                 'proguard-rules.pro'
    //     }
    // }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders += [networkSecurityConfig: "@xml/network_security_config_dev", usesCleartextTraffic: "true"]
        }
        release {
            manifestPlaceholders += [networkSecurityConfig: allowCleartextRelease ? "@xml/network_security_config_dev" : "@xml/network_security_config",
                                     usesCleartextTraffic: allowCleartextRelease ? "true" : "false"]
            // Uses android/key.properties (git-ignored, see key.properties.example) when present.
            // Without it, falls back to the debug key so local `flutter run --release` still works;
            // such builds cannot be uploaded to the Play Store.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            // useProguard true
            // shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'  // or the latest version

}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.browser:browser:1.8.0'
        force 'androidx.activity:activity:1.9.3'
        force 'androidx.activity:activity-ktx:1.9.3'
    }
}

