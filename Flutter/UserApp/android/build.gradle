allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:2.1.0'
            force 'org.jetbrains.kotlin:kotlin-reflect:2.1.0'
            force 'com.google.maps.android:android-maps-utils:3.6.0'
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
            force 'androidx.browser:browser:1.8.0'
            force 'androidx.activity:activity:1.9.3'
            force 'androidx.activity:activity-ktx:1.9.3'
        // razorpay_flutter asks for checkout:1.6.+ (and that for latest core libs), which
        // makes Gradle look versions up online on every build. Pin them so builds work offline.
        eachDependency { details ->
            if (details.requested.group == 'com.razorpay') {
                def pinned = [checkout: '1.6.41', 'standard-core': '1.7.20', core: '1.0.20']
                if (pinned[details.requested.name]) details.useVersion pinned[details.requested.name]
            }
        }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
