# Production backend on the AWS server (/opt/clikgett). Settings come from /opt/clikgett/.env
# (never in git). nginx on the host is the only way in: the API listens on 127.0.0.1 only.
#   cd /opt/clikgett && docker compose up -d --build
services:
  backend:
    build:
      context: ./Backend
    container_name: clikgett-backend
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    environment:
      PORT: 5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      # Customer uploads kept on disk must survive rebuilds.
      - photo_orders:/app/server/images/photo_orders
      - product_requests:/app/server/images/product_requests
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  photo_orders:
  product_requests:
