# /etc/nginx/conf.d/clikgett.conf on the AWS server. Certificates: Let's Encrypt (certbot).
# The backend container listens on 127.0.0.1:5000 only.

server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP: certbot challenges, everything else to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# API and media
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.clikgett.com;
    ssl_certificate /etc/letsencrypt/live/api.clikgett.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.clikgett.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;   # photo orders and admin uploads (the app limit is 15-20 MB)

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# Admin site (React build)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.clikgett.com;
    ssl_certificate /etc/letsencrypt/live/admin.clikgett.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.clikgett.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    root /var/www/admin;
    index index.html;
    location /static/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}

# Public website
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.clikgett.com;
    ssl_certificate /etc/letsencrypt/live/www.clikgett.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.clikgett.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/site;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
